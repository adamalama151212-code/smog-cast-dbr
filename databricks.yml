# =============================================================================
# Databricks Asset Bundle of smogcast.
#
# Every pipeline step is its own wheel (decision D14): one artifact per package,
# and each Job task installs smogcast-core plus the wheel of its step.
# `--env dev|prod` selects the configuration (Unity Catalog + volume instead of the
# local `data/` directory), so transformation code does not change.
#
# Before the first `databricks bundle deploy` on a workspace:
#   1. the infrastructure from the Terraform repo (catalog, schemas, volumes, the Jobs' service principal),
#   2. `workspace.host` and `run_as` of the target — values from `terraform output`.
# Identity: every Job runs as the target's service principal (`run_as`), whoever deploys — a laptop or CI.
# Its single-user clusters carry no user name of their own: Databricks assigns them to the Job's run-as identity.
# =============================================================================
bundle:
  name: smogcast

include:
  - resources/*.yml

# What lands in <bundle>/files on the workspace. Jobs need none of it — they install the wheels from
# `artifacts`, uploaded separately — so only the declarative pipeline's source goes up, not the whole
# repository (docs, Docker files). Add a path here when a resource needs source files.
sync:
  paths:
    - pipelines

artifacts:
  core:
    type: whl
    path: ./packages/core
    build: python -m build --wheel
  ingest:
    type: whl
    path: ./packages/ingest
    build: python -m build --wheel
  bronze:
    type: whl
    path: ./packages/bronze
    build: python -m build --wheel
  silver_clean:
    type: whl
    path: ./packages/silver_clean
    build: python -m build --wheel
  silver_transform:
    type: whl
    path: ./packages/silver_transform
    build: python -m build --wheel
  model:
    type: whl
    path: ./packages/model
    build: python -m build --wheel
  gold:
    type: whl
    path: ./packages/gold
    build: python -m build --wheel
  # The app (panel + assistant) is not part of this bundle: it has its own repository, is hosted outside the
  # Jobs and reads the secure gold views through a SQL Warehouse.

variables:
  env:
    description: "smogcast configuration environment (dev | prod)"
    default: dev
  jobs_principal:
    # One value for `run_as` and for the owner of the Jobs and the pipeline. Empty where there is no principal
    # (the course's PROD): the Jobs then run as, and belong to, whoever deploys.
    description: "Application (client) id of the service principal that runs and owns the Jobs and the pipeline"
    default: ""
  schema_prefix:
    # Must equal storage.schema_prefix in conf/<env>.yaml. Empty where the catalog is ours alone.
    description: "Prefix of our schemas in a catalog shared with other projects (e.g. smogcast_)"
    default: ""
  node_type:
    # Set per target: DEV and PROD are workspaces on different Azure accounts, and VM availability depends
    # on the region and the subscription's per-family vCPU quota.
    description: "Azure VM type of the single-node Job clusters"
  catalog:
    # Must equal storage.catalog in conf/<env>.yaml (the pipeline names its tables from that file).
    description: "Unity Catalog catalog of the environment (default catalog of the declarative pipeline)"
  live_trigger_pause_status:
    # The live Job's schedule (resources/job_smogcast_live.yml). PAUSED unless a target turns it on.
    description: "PAUSED | UNPAUSED — automatic runs of the live Job"
    default: PAUSED
  warehouse_id:
    # SQL Warehouse of the dashboard, found by NAME, so a new workspace needs no id in the code (every new Azure
    # Databricks workspace has this serverless warehouse; the course's PROD workspace too).
    description: "SQL Warehouse that runs the dashboard's queries"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  notification_email:
    # Where a FAILED Job run is reported (after its tasks' retries) — the author's address.
    description: "E-mail address for failed Job runs"
    default: adamalama152001@gmail.com

targets:
  dev:
    default: true
    # No `mode: development`: that mode gives every deployer a private copy. DEV is ONE copy, deployed from a
    # laptop or by CI ("deploy my branch to dev") — the same folder, the same Jobs, always run by the principal.
    presets:
      name_prefix: "[dev] "
    workspace:
      host: https://adb-7405617572397835.15.azuredatabricks.net   # dbw-smogcast-dev (workspace id 7405617572397835)
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}   # the same deployment for every deployer
    run_as:
      service_principal_name: ${var.jobs_principal}
    # Both deployers manage every resource of the bundle, so CI (logged in as the principal) can update what a laptop
    # deploy created and the other way round. smogcast-admins = the Terraform group the author is in.
    permissions:
      - group_name: smogcast-admins
        level: CAN_MANAGE
    # The owner is named here, not left to the bundle: without it the bundle makes whoever deploys the owner, and
    # only a workspace admin may change the owner of a Job or a pipeline – so CI, deploying as the principal, was
    # refused on everything a laptop deploy had created ("only workspace admins can change the owner of a job").
    # A dashboard has no owner level; there the principal gets CAN_MANAGE.
    resources:
      jobs:
        smogcast_batch:
          permissions:
            - service_principal_name: ${var.jobs_principal}
              level: IS_OWNER
        smogcast_live:
          permissions:
            - service_principal_name: ${var.jobs_principal}
              level: IS_OWNER
        smogcast_fault_demo:
          permissions:
            - service_principal_name: ${var.jobs_principal}
              level: IS_OWNER
      pipelines:
        smogcast_stream:
          permissions:
            - service_principal_name: ${var.jobs_principal}
              level: IS_OWNER
      dashboards:
        smogcast:
          permissions:
            - service_principal_name: ${var.jobs_principal}
              level: CAN_MANAGE
    variables:
      env: dev
      # sp-smogcast-dev (Terraform module `identity`, output jobs_service_principal_application_id)
      jobs_principal: bd4c1f08-eef6-4502-bfef-76ef72b2f2a6
      catalog: smogcast_dev
      # DC4as_v5 (4 vCPU, 16 GB): had capacity in Germany West Central when D4ds_v5 failed with
      # CLOUD_PROVIDER_RESOURCE_STOCKOUT (2026-10-06). The trial subscription allows 4 vCPUs in the region, so only
      # one Job cluster runs at a time.
      node_type: Standard_DC4as_v5
      # The live Job runs by itself 3 times a day on DEV (decision of the author, 2026-10-07).
      live_trigger_pause_status: UNPAUSED

  prod:
    # The course's shared workspace (dbr_dev_trial_2, East US). What a shared account changes, all of it in this target:
    #   - no service principal of our own → no `run_as`: the Jobs run as, and belong to, the account that deploys;
    #   - no catalog of our own → prefixed schemas in the shared catalog, created by the bundle (schemas, volumes);
    #   - no Azure resources of our own → no Azure Function: the live Job polls the GIOŚ API itself.
    # The course asks to keep serverless for what needs it: here the SQL Warehouse and the stream pipeline (an update
    # of about 2 minutes; a classic cluster would take about 11 minutes to start for it). The Jobs use Job clusters.
    # mode: production — the bundle refuses deploys from a laptop with uncommitted changes; deployed by CI from a tag.
    mode: production
    workspace:
      host: https://adb-7405618361895520.0.azuredatabricks.net
      # One copy, in the folder of the account that deploys (a laptop and CI use the same account there). Not
      # /Workspace/Shared as on DEV: on the course's workspace every participant could change the files.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod
      catalog: dbr_dev
      schema_prefix: smogcast_
      # D4ds_v5 (4 vCPU, 16 GB, about 1 DBU): on the course's list of allowed types; small clusters only (up to 2 DBU).
      node_type: Standard_D4ds_v5
      # The live Job runs by itself 3 times a day (since 2026-10-13, after its first run by hand): every day without
      # it is a day without an official forecast to compare with what was measured.
      live_trigger_pause_status: UNPAUSED
    resources:
      schemas:
        bronze: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}bronze", comment: "smogcast – raw data as delivered"}
        silver: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}silver", comment: "smogcast – cleaned data and model features"}
        gold: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}gold", comment: "smogcast – forecasts, verification, data quality"}
        ops: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}ops", comment: "smogcast – quarantine, rejected readings, access policy"}
        gold_secure: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}gold_secure", comment: "smogcast – row/column-secured views of gold"}
        raw: {catalog_name: "${var.catalog}", name: "${var.schema_prefix}raw", comment: "smogcast – volumes: landing files, checkpoints, saved models"}
      volumes:
        landing: {catalog_name: "${var.catalog}", schema_name: "${resources.schemas.raw.name}", name: landing, volume_type: MANAGED}
        checkpoints: {catalog_name: "${var.catalog}", schema_name: "${resources.schemas.raw.name}", name: checkpoints, volume_type: MANAGED}
        models: {catalog_name: "${var.catalog}", schema_name: "${resources.schemas.raw.name}", name: models, volume_type: MANAGED}
      jobs:
        smogcast_live:
          tasks:
            # The two polls the Azure Function does on DEV (the same code: smogcast.ingest.live_poll). The GIOŚ API
            # returns about 3 days back, so three runs a day lose no reading.
            - task_key: ingest_gios_registry
              max_retries: 2
              min_retry_interval_millis: 600000
              retry_on_timeout: true
              timeout_seconds: 1800
              job_cluster_key: live
              python_wheel_task: {package_name: smogcast_ingest, entry_point: smogcast-ingest, parameters: ["--step", "gios-registry", "--env", "${var.env}"]}
              libraries: [{whl: ./packages/core/dist/*.whl}, {whl: ./packages/ingest/dist/*.whl}]
            - task_key: ingest_gios_live
              max_retries: 2
              min_retry_interval_millis: 600000
              retry_on_timeout: true
              timeout_seconds: 1800
              depends_on: [{task_key: ingest_gios_registry}]   # reads the newest registry snapshot
              job_cluster_key: live
              python_wheel_task: {package_name: smogcast_ingest, entry_point: smogcast-ingest, parameters: ["--step", "gios-live", "--env", "${var.env}"]}
              libraries: [{whl: ./packages/core/dist/*.whl}, {whl: ./packages/ingest/dist/*.whl}]
            # depends_on of a target is ADDED to the task's list in resources/job_smogcast_live.yml
            - task_key: bronze_station_snapshots
              depends_on: [{task_key: ingest_gios_registry}]
            - task_key: stream_pipeline
              depends_on: [{task_key: ingest_gios_live}]
