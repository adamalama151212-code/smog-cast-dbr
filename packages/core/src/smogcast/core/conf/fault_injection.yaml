# =============================================================================
# Fault-injection replay (decision D17, ARCHITECTURE.md section 11.3).
#
# A COPY of real hourly measurements is replayed as a stream of hourly batches (same file
# format as the live GIOŚ API) and corrupted on a fixed, deterministic schedule — so the
# cleaning steps can be tested and demonstrated predictably. The model's history
# (silver.pm_hourly) never reads this data: it lands in its own folder and its own source.
#
# Window chosen on real data: Kraków 17–21 Jan 2025. Clean air at the start (PM10 city mean
# ~24 µg/m³), then a REAL smog episode in which all stations rise together (20 Jan: ~100,
# twice the limit). The episode is NOT injected — it must pass the cleaning unflagged.
# =============================================================================
fault_injection:
  city: krakow
  pollutants: [PM10]
  start_utc: "2025-01-17T00:00:00"
  hours: 120
  # A batch is "sent" this many minutes after its last hour ends (normal publication delay).
  send_delay_minutes: 20

  # station_index = position in the alphabetically sorted list of the city's stations that have
  # data in the window (so the schedule does not depend on hard-coded station codes).
  # hour = hours since start_utc. Expected cleaning result in the comment of each fault.
  schedule:
    - {type: outage, station_index: 0, hour: 6, hours: 8}          # buffered, re-sent at the end -> first hours late (> 3 h) -> ops.pm_late_rejected
    - {type: duplicate_batch, hour: 20}                            # same batch file sent twice -> one record in silver (dedup)
    - {type: negative, station_index: 1, hour: 26}                 # -> ops.pm_quarantine, below_min
    - {type: out_of_range, station_index: 2, hour: 27, value: 1500}  # -> ops.pm_quarantine, above_max
    - {type: missing_value, station_index: 3, hour: 28}            # -> ops.pm_quarantine, missing_value
    - {type: frozen, station_index: 4, hour: 32, hours: 9}         # same value repeated -> dq_flag frozen
    - {type: spike, station_index: 1, hour: 44, factor: 6.0}       # one hour x6 -> dq_flag spike
    - {type: drift, station_index: 2, hour: 50, hours: 40, rate_per_hour: 0.04}  # +4 %/h multiplicative -> dq_flag drift
    # Registry change for the CDC demo: a second registry snapshot half-way through the window
    # in which one station disappears and another gets a new sensor (silver.station_changes).
    - {type: registry_change, hour: 60, remove_station_index: 5, add_sensor_station_index: 0}
