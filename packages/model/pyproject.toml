[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smogcast-model"
version = "0.2.0"  # x-release-please-version (must equal ../../VERSION, checked by a test)
description = "smogcast step: forecast model training and backtest"
requires-python = ">=3.10,<3.13"
dependencies = [
    "smogcast-core==0.2.0",  # x-release-please-version
    # pyspark.ml imports numpy; it is preinstalled in Databricks runtimes but not in plain pyspark.
    "numpy>=1.24",
]

[project.scripts]
# One console script per wheel; a Databricks python_wheel_task calls it with --step.
smogcast-model = "smogcast.model.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smogcast.*"]
namespaces = true  # PEP 420: no src/smogcast/__init__.py in any smogcast-* wheel
