[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smogcast-bronze"
version = "0.2.0"  # x-release-please-version (must equal ../../VERSION, checked by a test)
description = "smogcast step: landing files into bronze delta tables"
requires-python = ">=3.10,<3.13"
dependencies = [
    "smogcast-core==0.2.0",  # x-release-please-version
    # Spark cannot read xlsx; the GIOŚ archive sheets are streamed with openpyxl (read-only mode).
    "openpyxl>=3.1",
]

[project.scripts]
# One console script per wheel; a Databricks python_wheel_task calls it with --step.
smogcast-bronze = "smogcast.bronze.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smogcast.*"]
namespaces = true  # PEP 420: no src/smogcast/__init__.py in any smogcast-* wheel
