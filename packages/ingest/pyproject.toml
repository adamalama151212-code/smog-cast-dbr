[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smogcast-ingest"
version = "0.3.0"  # x-release-please-version (must equal ../../VERSION, checked by a test)
description = "smogcast step: raw data into the landing zone"
requires-python = ">=3.10,<3.13"
dependencies = [
    "smogcast-core==0.3.0",  # x-release-please-version
    "requests>=2.31",
    # Writes GIOŚ-format xlsx sheets for the synthetic archive (integration tests, CI, --offline).
    "openpyxl>=3.1",
]

[project.scripts]
# One console script per wheel; a Databricks python_wheel_task calls it with --step.
smogcast-ingest = "smogcast.ingest.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smogcast.*"]
namespaces = true  # PEP 420: no src/smogcast/__init__.py in any smogcast-* wheel
