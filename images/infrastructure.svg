<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" width="960" height="770" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">smogcast: the whole infrastructure (DEV)</title>
  <desc id="d">Sources (GIOŚ, Open-Meteo) and GitHub Actions at the top; an Azure Function polls the GIOŚ API every hour and Lakeflow Jobs with a declarative pipeline process the data; Unity Catalog keeps bronze, silver, gold and the secured gold_secure views; a SQL Warehouse serves them to the AI/BI dashboard and to the app smog-cast-app on Azure Container Apps, which reads its secrets from Key Vault and asks a language model only for follow-ups and advice.</desc>
