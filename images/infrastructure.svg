  <text x="162" y="61" font-size="14" fill="#334155" font-weight="700">GIOŚ</text>
  <text x="162" y="91" font-size="12.5" fill="#1e293b">hourly PM10 and PM2.5:</text>
  <text x="162" y="108" font-size="12.5" fill="#1e293b">archive + live API</text>
  <g filter="url(#s)"><rect x="380" y="40" width="200" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M380 50 a10 10 0 0 1 10 -10 h180 a10 10 0 0 1 10 10 v22 h-200 z" fill="#f1f5f9"/></g>
