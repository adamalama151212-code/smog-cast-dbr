<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Assistant tab: "Will there be smog tomorrow in Kraków?"</title>
  <desc id="d">1. Routing rules recognise a city and the word tomorrow (no language model). 2. The app reads forecast_tomorrow, reliability and acceptance from the gold_secure views through the SQL Warehouse, as its own principal with the analyst role. 3. Code builds the sentences: probability, warning, run kind, how often such a probability came true in 2025, the K1-K4 verdict. 4. The answer and the SQL. A language model is used only to rewrite a follow-up question and to write advice from retrieved documents.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="960" height="640" rx="16" fill="#ffffff"/>

  <!-- the question -->
  <rect x="16" y="18" width="484" height="54" rx="27" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="45" cy="45" r="16" fill="#334155"/>
  <circle cx="45" cy="40" r="5.5" fill="#ffffff"/>
  <path d="M35 54 a10 8 0 0 1 20 0 z" fill="#ffffff"/>
  <text x="72" y="51" font-size="16.5" font-style="italic" font-weight="600" fill="#0f172a">“Will there be smog tomorrow in Kraków?”</text>
  <text x="518" y="44" font-size="13" fill="#64748b">typed in the Assistant tab of the app</text>
  <text x="518" y="62" font-size="13" fill="#64748b">(Reflex, hosted on Azure Container Apps)</text>
  <line x1="118" y1="72" x2="118" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 1 routing rules -->
  <g filter="url(#s)">
    <rect x="16" y="110" width="204" height="222" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M16 122 a12 12 0 0 1 12 -12 h180 a12 12 0 0 1 12 12 v32 h-204 z" fill="#dbeafe"/>
  </g>
  <circle cx="40" cy="132" r="13" fill="#2563eb"/><text x="40" y="137" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="61" y="137" font-size="15" font-weight="700" fill="#1e3a8a">Routing rules</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="30" y="180">Finds a city and the</tspan>
    <tspan x="30" y="199">word “tomorrow”</tspan>
    <tspan x="30" y="222" font-weight="700" fill="#1d4ed8">→ intent: forecast</tspan>
    <tspan x="30" y="256">A clear case – the</tspan>
    <tspan x="30" y="275">language model is</tspan>
    <tspan x="30" y="294">not asked.</tspan>
  </text>

  <!-- 2 read the data -->
  <g filter="url(#s)">
    <rect x="256" y="110" width="204" height="222" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <path d="M256 122 a12 12 0 0 1 12 -12 h180 a12 12 0 0 1 12 12 v32 h-204 z" fill="#d1fae5"/>
  </g>
  <circle cx="280" cy="132" r="13" fill="#059669"/><text x="280" y="137" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="301" y="137" font-size="15" font-weight="700" fill="#064e3b">Read the data</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="270" y="180">SQL Warehouse, views</tspan>
    <tspan x="270" y="199">gold_secure, as the app’s</tspan>
    <tspan x="270" y="218">own principal (role</tspan>
    <tspan x="270" y="237">analyst – RLS/CLS)</tspan>
  </text>
  <rect x="268" y="252" width="180" height="68" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text font-size="12.5" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#065f46">
    <tspan x="278" y="271">forecast_tomorrow</tspan>
    <tspan x="278" y="290">reliability</tspan>
    <tspan x="278" y="309">acceptance</tspan>
  </text>

  <!-- 3 build the answer -->
  <g filter="url(#s)">
    <rect x="496" y="110" width="204" height="222" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M496 122 a12 12 0 0 1 12 -12 h180 a12 12 0 0 1 12 12 v32 h-204 z" fill="#dbeafe"/>
  </g>
  <circle cx="520" cy="132" r="13" fill="#2563eb"/><text x="520" y="137" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="541" y="137" font-size="15" font-weight="700" fill="#1e3a8a">Build the answer</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="510" y="180">Sentences made by code</tspan>
    <tspan x="510" y="199">from the rows:</tspan>
    <tspan x="510" y="222">• probability, warning</tspan>
    <tspan x="510" y="241">• official or update run</tspan>
    <tspan x="510" y="260">• how often such a %</tspan>
    <tspan x="521" y="279">came true in 2025</tspan>
    <tspan x="510" y="298">• the K1–K4 verdict</tspan>
  </text>

  <!-- 4 answer -->
  <g filter="url(#s)">
    <rect x="736" y="110" width="208" height="222" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M736 122 a12 12 0 0 1 12 -12 h184 a12 12 0 0 1 12 12 v32 h-208 z" fill="#e2e8f0"/>
  </g>
  <circle cx="760" cy="132" r="13" fill="#334155"/><text x="760" y="137" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="781" y="137" font-size="15" font-weight="700" fill="#0f172a">The answer</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="750" y="180" font-weight="700">Kraków, PM2.5, 15 Oct</tspan>
    <tspan x="750" y="202" font-size="17" font-weight="700" fill="#047857">12% – no warning</tspan>
    <tspan x="750" y="228">In 2025, at forecasts of</tspan>
    <tspan x="750" y="247">10–20% the limit was</tspan>
    <tspan x="750" y="266">exceeded on 18% of days.</tspan>
    <tspan x="750" y="300" fill="#64748b">+ the SQL it ran</tspan>
  </text>

  <!-- main path arrows -->
  <line x1="220" y1="221" x2="252" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="221" x2="492" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="221" x2="732" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- follow-up branch -->
  <rect x="16" y="404" width="444" height="118" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="430" font-size="14.5" font-weight="700" fill="#5b21b6">Language model – only for a follow-up</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="32" y="455">“And in Wrocław?” has no “tomorrow”: the model reads</tspan>
    <tspan x="32" y="474">the conversation and rewrites the question –</tspan>
    <tspan x="32" y="493" font-weight="600">“Will there be smog tomorrow in Wrocław?”</tspan>
    <tspan x="32" y="512">– which then goes through steps 2–4 as usual.</tspan>
  </text>
  <path d="M90 332 V400" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <text x="98" y="372" font-size="12" fill="#6d28d9">follow-up</text>
  <path d="M380 404 V336" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <text x="388" y="372" font-size="12" fill="#6d28d9">rewritten</text>

  <!-- advice branch -->
  <rect x="496" y="404" width="448" height="118" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="512" y="430" font-size="14.5" font-weight="700" fill="#5b21b6">Language model – only if advice is asked</text>
  <text font-size="13" fill="#1e293b">
    <tspan x="512" y="455">“Should I go running tomorrow?” – passages found in the</tspan>
    <tspan x="512" y="474">documents (RAG: regulations, GIOŚ and WHO guidance) go</tspan>
    <tspan x="512" y="493">to the model, which writes advice from them only, with</tspan>
    <tspan x="512" y="512">sources, under the answer.</tspan>
  </text>
  <path d="M598 332 V400" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <text x="606" y="372" font-size="12" fill="#6d28d9">advice asked</text>
  <path d="M840 404 V336" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <text x="848" y="372" font-size="12" fill="#6d28d9">advice</text>

  <!-- legend -->
  <line x1="16" y1="552" x2="944" y2="552" stroke="#e2e8f0"/>
  <line x1="20" y1="580" x2="56" y2="580" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="64" y="585" font-size="12.5" fill="#334155">every question</text>
  <line x1="170" y1="580" x2="206" y2="580" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ap)"/>
  <text x="214" y="585" font-size="12.5" fill="#334155">only when needed</text>
  <rect x="340" y="572" width="16" height="16" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="362" y="585" font-size="12.5" fill="#334155">rules and code</text>
  <rect x="468" y="572" width="16" height="16" rx="4" fill="#d1fae5" stroke="#059669"/>
  <text x="490" y="585" font-size="12.5" fill="#334155">data</text>
  <rect x="534" y="572" width="16" height="16" rx="4" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="556" y="585" font-size="12.5" fill="#334155">language model</text>
  <text x="20" y="620" font-size="13" font-weight="700" fill="#0f172a">The language model never produces a number.</text>
</svg>
