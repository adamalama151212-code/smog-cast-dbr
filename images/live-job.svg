<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">smogcast: the live Job – three runs a day to tomorrow's forecast</title>
  <desc id="d">GIOŚ readings and the station registry (polled every hour) and tomorrow's Open-Meteo forecast go to bronze; the declarative pipeline cleans the stream (duplicates, late readings, quarantine, flags), the station registry becomes an SCD2 table, the weather is aggregated per CET day; today's features go through the saved model from the batch Job into forecast_tomorrow and forecast_history; official forecasts are later compared with what was measured. Runs at 00:30, 11:30 (official) and 17:30 CET.</desc>
