<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">smogcast: the batch Job – history to the trained model</title>
  <desc id="d">The GIOŚ archive and weather-forecast archives 2021–2025 go to bronze, are cleaned into daily city means and daily weather in silver and joined into features of day D. The model is trained on 2021–2023, chosen on 2024 (lowest Brier score: GBT), refitted on 2021–2024 as the final model and tested once on 2025. The results go to gold; the saved final model is what the live Job uses.</desc>
